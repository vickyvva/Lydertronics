name: Add Careers Link

on:
  push:
    paths:
      - '.github/workflows/add-careers-link.yml'

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Careers links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          nav_old = '        <li><a href="#contact"    class="nav-link cta-nav" data-section="contact">Contact</a></li>'
          nav_new = '        <li><a href="careers.html" class="nav-link">Careers</a></li>\n' + nav_old
          if 'href="careers.html" class="nav-link">Careers</a>' not in s:
              s = s.replace(nav_old, nav_new)
          footer_old = '            <li><a href="#contact">Contact</a></li>'
          footer_new = '            <li><a href="careers.html">Careers</a></li>\n' + footer_old
          if '<li><a href="careers.html">Careers</a></li>' not in s:
              s = s.replace(footer_old, footer_new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Show Careers link on homepage"
          git push
